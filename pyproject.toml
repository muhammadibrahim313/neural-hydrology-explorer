[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nhplay"
version = "0.1.0"
description = "Neural Hydrology Explorer: a small, readable LSTM-vs-Transformer rainfall-runoff learning project built on NeuralHydrology and CAMELS-US."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Neural Hydrology Explorer contributors" }]
keywords = ["hydrology", "streamflow", "LSTM", "transformer", "neuralhydrology", "CAMELS"]
dependencies = [
  "torch>=2.2",
  "neuralhydrology>=1.13",
  "numpy",
  "pandas",
  "xarray",
  "netcdf4",
  "matplotlib",
  "plotly",
  "streamlit",
  "requests",
  "remotezip",
  "ruamel.yaml",
  "tqdm",
  "tabulate",
]

[project.optional-dependencies]
notebooks = ["jupyterlab", "ipykernel", "nbconvert", "nbformat"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
