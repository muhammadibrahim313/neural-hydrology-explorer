# ======================================================================================
# Shared data + split settings.  BOTH model configs copy these blocks verbatim so that the
# LSTM and the Transformer see exactly the same basins, inputs, target and time periods.
# (NeuralHydrology reads one flat YAML file per run; this file is documentation only and
# scripts/check_configs.py asserts that lstm.yml and transformer.yml agree with it.)
# ======================================================================================

# --- which basins -----------------------------------------------------------------------
train_basin_file: data/basins.txt
validation_basin_file: data/basins.txt
test_basin_file: data/basins.txt

# --- chronological split (DD/MM/YYYY), water years run 1 Oct -> 30 Sep -------------------
# train      : 19 water years. The first 365 days are only used as "warm-up" input history.
# validation :  5 water years, used to pick the best epoch and to watch for over-fitting.
# test       : 10 water years that the model never sees during training or model selection.
train_start_date: "01/10/1980"
train_end_date: "30/09/1999"
validation_start_date: "01/10/1999"
validation_end_date: "30/09/2004"
test_start_date: "01/10/2004"
test_end_date: "30/09/2014"

# --- dataset ----------------------------------------------------------------------------
dataset: camels_us
data_dir: data/camels_us
forcings:
  - daymet

# DYNAMIC inputs: one value per basin per day (Daymet, averaged over the basin)
dynamic_inputs:
  - prcp(mm/day)   # precipitation
  - tmax(C)        # daily max temperature
  - tmin(C)        # daily min temperature
  - srad(W/m2)     # solar radiation
  - vp(Pa)         # vapour pressure (humidity)

# TARGET: observed streamflow at the gauge, converted by NeuralHydrology from cfs to mm/day
target_variables:
  - QObs(mm/d)
clip_targets_to_zero:
  - QObs(mm/d)

# STATIC attributes: one value per basin, constant in time (CAMELS attributes v2.0)
static_attributes:
  - area_gages2            # basin area
  - elev_mean              # mean elevation
  - slope_mean             # mean slope
  - frac_forest            # forest fraction
  - lai_max                # max leaf area index
  - soil_depth_pelletier   # depth to bedrock
  - soil_porosity
  - soil_conductivity
  - sand_frac
  - clay_frac
  - p_mean                 # climate: mean precipitation
  - pet_mean               # climate: mean potential evapotranspiration
  - aridity                # climate: PET / P
  - frac_snow              # climate: fraction of precipitation falling as snow
  - high_prec_freq
  - high_prec_dur
  - low_prec_freq
  - low_prec_dur
